<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 深度分析 - 测试版</title>
<style>
  :root {
    --bg-primary: #0f1117; --bg-secondary: #161822; --bg-card: #1a1d2e;
    --border: #2a2d3e; --text-primary: #e8eaed; --text-secondary: #9aa0b4;
    --text-muted: #5f6577; --accent-blue: #4b8bff; --accent-green: #00c853;
    --accent-red: #ff3d57; --accent-orange: #ff9100; --radius: 10px; --radius-sm: 6px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
  .container { max-width: 800px; width: 100%; }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 22px; margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--text-muted); }
  .search-box { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
  .search-box input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 12px 18px; border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; width: 240px; outline: none; }
  .search-box input:focus { border-color: var(--accent-blue); }
  .search-box button { background: var(--accent-blue); border: none; color: #fff; padding: 12px 28px; border-radius: var(--radius-sm); font-size: 15px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .search-box button:hover { opacity: .9; }
  .search-box button:disabled { opacity: .5; cursor: not-allowed; }
  .result-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; line-height: 1.8; }
  .result-card h3 { font-size: 16px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .result-card h4 { font-size: 14px; color: var(--accent-blue); margin: 16px 0 6px; }
  .result-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.9; }
  .result-card li { font-size: 14px; color: var(--text-secondary); line-height: 1.9; }
  .loading-box { text-align: center; padding: 40px; color: var(--text-muted); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: rgba(255,61,87,.08); border: 1px solid rgba(255,61,87,.3); border-radius: var(--radius-sm); padding: 16px; color: var(--accent-red); font-size: 13px; }
  .info-bar { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 20px; }
  .step-text { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>AI 深度分析</h1>
    <p>测试版 · SiliconFlow Qwen2.5 · 六维深度分析</p>
  </div>

  <div class="search-box">
    <input type="text" id="stockInput" placeholder="输入股票代码，如 600519" maxlength="6" onkeydown="if(event.key==='Enter')analyze()">
    <button id="analyzeBtn" onclick="analyze()">深度分析</button>
  </div>
  <div id="result"></div>
  <div class="info-bar">测试满意后将合并到主页面 | 财报部分为付费版预览</div>

<!-- Full Financial Analysis (Paid Preview) -->
<div style="margin-top:24px;background:var(--bg-card);border:1px solid #2a4a2a;border-radius:var(--radius);padding:20px 24px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h3 style="font-size:16px;margin:0;">完整财报分析 <span style="font-size:10px;color:var(--accent-orange);border:1px solid var(--accent-orange);padding:2px 8px;border-radius:10px;">付费版</span></h3>
    <span style="font-size:10px;color:var(--text-muted);" id="finStatus"></span>
  </div>
  <div id="fullFinance"></div>
</div>
</div>

<script>
async function fetchQuote(code) {
  const prefix = ['0','3'].includes(code[0]) ? 'sz' : 'sh';
  try {
    const r = await fetch(`https://qt.gtimg.cn/q=${prefix}${code}`);
    const buf = await r.arrayBuffer();
    const text = new TextDecoder('gbk').decode(buf);
    const m = text.match(/\"([^\"]+)\"/);
    if (!m) return null;
    const p = m[1].split('~');
    if (!p[1]) return null;
    const price = parseFloat(p[3]);
    return {
      name: p[1], price: price.toFixed(2), open: (parseFloat(p[5])||price).toFixed(2),
      high: (parseFloat(p[33])||price).toFixed(2), low: (parseFloat(p[34])||price).toFixed(2),
      prevClose: (parseFloat(p[4])||price).toFixed(2),
      changePct: p[32] || '0',
      amount: (parseFloat(p[37])||0) > 10000 ? (parseFloat(p[37])/10000).toFixed(2) : (parseFloat(p[37])||0).toFixed(2),
      pe: p[39] && parseFloat(p[39])>0 ? parseFloat(p[39]).toFixed(2) : '-',
      pb: '-', turnover: p[38] ? parseFloat(p[38]).toFixed(2) : '-',
      amplitude: p[43] ? parseFloat(p[43]).toFixed(2) : '-',
      volumeRatio: '-', totalCap: p[44] ? parseFloat(p[44]).toFixed(0) : '-',
    };
  } catch(e) { return null; }
}

async function fetchKlines(code) {
  const prefix = ['0','3'].includes(code[0]) ? 'sz' : 'sh';
  try {
    const r = await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${prefix}${code},day,,,60,qfq`);
    const j = await r.json();
    const data = j.data?.[`${prefix}${code}`]?.qfqday || j.data?.[`${prefix}${code}`]?.day || [];
    return data.map(d => ({ date: d[0], open: d[1], close: d[2], high: d[3], low: d[4], volume: parseInt(d[5]) || 0 }));
  } catch(e) { return []; }
}

async function fetchNews(code) {
  try {
    const r = await fetch(`https://search-api-web.eastmoney.com/search/jsonp?cb=jQuery&param=%7B%22uid%22%3A%22%22%2C%22keyword%22%3A%22${code}%22%2C%22type%22%3A%5B%22cmsArticleWebOld%22%5D%2C%22client%22%3A%22web%22%2C%22clientType%22%3A%22web%22%2C%22clientVersion%22%3A%22curr%22%2C%22param%22%3A%7B%22cmsArticleWebOld%22%3A%7B%22searchScope%22%3A%22default%22%2C%22sort%22%3A%22default%22%2C%22pageIndex%22%3A1%2C%22pageSize%22%3A5%2C%22preTag%22%3A%22%22%2C%22postTag%22%3A%22%22%7D%7D%7D`);
    const text = await r.text();
    const json = JSON.parse(text.replace(/^jQuery\d+_?\d*\(/, '').replace(/\)\s*$/, ''));
    return (json.cmsArticleWebOld || []).slice(0, 5).map(a => a.title || '').join('；');
  } catch(e) { return ''; }
}

async function analyze() {
  const code = document.getElementById('stockInput').value.trim();
  const result = document.getElementById('result');
  const btn = document.getElementById('analyzeBtn');
  if (!/^\d{6}$/.test(code)) { result.innerHTML = '<div class="error-box">请输入 6 位股票代码</div>'; return; }

  btn.disabled = true; btn.textContent = '分析中...';
  result.innerHTML = '<div class="loading-box"><div class="spinner"></div><div class="step-text" id="stepText">正在获取行情数据...</div></div>';

  const updateStep = s => { const el = document.getElementById('stepText'); if (el) el.textContent = s; };

  try {
    updateStep('正在获取行情数据...');
    const quote = await fetchQuote(code);
    if (!quote) throw new Error('未找到该股票');

    updateStep('正在获取 K 线数据...');
    const klines = await fetchKlines(code);

    updateStep('正在获取相关资讯...');
    const newsSummary = await fetchNews(code);

    updateStep('AI 正在生成六维分析报告，约需 10-20 秒...');
    const resp = await fetch('/api/ai-analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, quote, klines, newsSummary }),
    });
    const json = await resp.json();
    if (json.error) throw new Error(json.error);

    result.innerHTML = `
      <div class="result-card">
        <h3>${json.name}（${json.code}）深度分析报告</h3>
        ${json.report
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/###\s*(.*)/g, '<h4>$1</h4>')
          .replace(/##\s*(.*)/g, '<h4>$1</h4>')
          .replace(/（([一二三四五六七八九十]+)）、/g, '<br><strong>（$1）</strong>')
          .split('\n\n').filter(p => p.trim()).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}
      </div>`;
  } catch (e) {
    result.innerHTML = `<div class="error-box">${e.message}</div>`;
  }
  btn.disabled = false; btn.textContent = '深度分析';
  // Also fetch finance data
  fetchFullFinance(code);
}

async function fetchFullFinance(code) {
  const status = document.getElementById('finStatus');
  const el = document.getElementById('fullFinance');
  status.textContent = '加载中...';
  try {
    const r = await fetch(`/api/finance?stock=${code}`);
    const j = await r.json();
    if (!j.reports || !j.reports.length) { el.innerHTML = '<div style="padding:10px;color:var(--text-muted);">暂无财报数据</div>'; status.textContent = ''; return; }
    const reports = j.reports;
    const latest = reports[0];

    // Multi-year comparison table
    const tableRows = reports.map(r => {
      const check30 = (v) => v != null && parseFloat(v) >= 30;
      return `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);">
        <td style="padding:6px 10px;">${r.reportDate}</td>
        <td style="padding:6px 10px;">${r.reportType}</td>
        <td style="padding:6px 10px;text-align:right;">${r.revenue!=null?r.revenue.toFixed(1)+'亿':'--'}</td>
        <td style="padding:6px 10px;text-align:right;color:${check30(r.revenueYoY)?'var(--accent-green)':'var(--text-muted)'};">${r.revenueYoY!=null?r.revenueYoY+'%':'--'}</td>
        <td style="padding:6px 10px;text-align:right;">${r.deductProfit!=null?r.deductProfit.toFixed(1)+'亿':'--'}</td>
        <td style="padding:6px 10px;text-align:right;color:${check30(r.deductProfitYoY)?'var(--accent-green)':'var(--text-secondary)'};">${r.deductProfitYoY!=null?r.deductProfitYoY+'%':'--'}</td>
        <td style="padding:6px 10px;text-align:right;color:${r.roe!=null&&parseFloat(r.roe)>=15?'var(--accent-green)':'var(--text-secondary)'};">${r.roe!=null?r.roe+'%':'--'}</td>
      </tr>`;
    }).join('');

    // DuPont analysis
    const dupontROE = latest.roe || 0;
    const dupontMargin = latest.netMargin || 0;
    const dupontTurnover = latest.totalAssets > 0 ? (latest.revenue / latest.totalAssets * 100).toFixed(2) : 0;
    const dupontLeverage = latest.totalAssets > 0 && latest.totalAssets > latest.debtRatio ? (latest.totalAssets / (latest.totalAssets * (1 - latest.debtRatio/100))).toFixed(2) : '--';

    // Financial health score
    let healthScore = 50;
    if (latest.revenueYoY && parseFloat(latest.revenueYoY) > 20) healthScore += 10;
    if (latest.deductProfitYoY && parseFloat(latest.deductProfitYoY) > 30) healthScore += 15;
    if (latest.roe && parseFloat(latest.roe) > 15) healthScore += 10;
    if (latest.debtRatio && parseFloat(latest.debtRatio) < 50) healthScore += 10;
    if (latest.grossMargin && parseFloat(latest.grossMargin) > 30) healthScore += 5;
    if (latest.netMargin && parseFloat(latest.netMargin) > 10) healthScore += 10;
    healthScore = Math.min(100, healthScore);

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:16px;">

        <!-- Multi-year comparison -->
        <div>
          <h4 style="font-size:13px;color:var(--accent-blue);margin-bottom:8px;">历年财报对比</h4>
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:12px;">
              <thead><tr style="color:var(--text-muted);font-size:11px;">
                <th style="text-align:left;padding:6px 10px;">报告期</th><th style="text-align:left;padding:6px 10px;">类型</th>
                <th style="text-align:right;padding:6px 10px;">营收</th><th style="text-align:right;padding:6px 10px;">营收增速</th>
                <th style="text-align:right;padding:6px 10px;">扣非净利</th><th style="text-align:right;padding:6px 10px;">扣非增速</th>
                <th style="text-align:right;padding:6px 10px;">ROE</th>
              </tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>

        <!-- DuPont -->
        <div>
          <h4 style="font-size:13px;color:var(--accent-blue);margin-bottom:8px;">杜邦分析</h4>
          <div style="font-size:12px;color:var(--text-secondary);line-height:2;">
            ROE = 净利率 × 资产周转率 × 权益乘数<br>
            <span style="color:var(--accent-green);">${dupontROE}%</span> = <span style="color:var(--accent-blue);">${dupontMargin}%</span> × <span style="color:var(--accent-blue);">${dupontTurnover}%</span> × <span style="color:var(--accent-blue);">${dupontLeverage}</span>
          </div>
        </div>

        <!-- Financial Health Score -->
        <div>
          <h4 style="font-size:13px;color:var(--accent-blue);margin-bottom:8px;">财务健康评分</h4>
          <div style="display:flex;align-items:center;gap:14px;">
            <div style="text-align:center;"><div style="font-size:36px;font-weight:700;color:${healthScore>=70?'var(--accent-green)':healthScore>=40?'var(--accent-orange)':'var(--accent-red)'};">${healthScore}</div><div style="font-size:10px;color:var(--text-muted);">/100</div></div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.8;">
              <div>营收增速 ${parseFloat(latest.revenueYoY||0)>20?'+'+(parseFloat(latest.revenueYoY)-20).toFixed(1):'差'+(20-parseFloat(latest.revenueYoY||0)).toFixed(1)}% 达标</div>
              <div>扣非增速 ${parseFloat(latest.deductProfitYoY||0)>30?'+10':'未达标'}</div>
              <div>ROE ${parseFloat(latest.roe||0)>15?'+10':'未达标'}</div>
              <div>负债率 ${parseFloat(latest.debtRatio||0)<50?'+10 ('+parseFloat(latest.debtRatio).toFixed(1)+'%)':parseFloat(latest.debtRatio)+'%(偏高)'}</div>
              <div>毛利率 ${parseFloat(latest.grossMargin||0)>30?'+5 ('+parseFloat(latest.grossMargin).toFixed(1)+'%)':''}</div>
            </div>
          </div>
        </div>

        <!-- Key Metrics Summary -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12px;">
          <div style="background:var(--bg-secondary);padding:10px;border-radius:var(--radius-sm);"><div style="color:var(--text-muted);">每股收益</div><div style="font-weight:600;">${latest.eps||'--'}</div></div>
          <div style="background:var(--bg-secondary);padding:10px;border-radius:var(--radius-sm);"><div style="color:var(--text-muted);">每股净资产</div><div style="font-weight:600;">${latest.bps||'--'}</div></div>
          <div style="background:var(--bg-secondary);padding:10px;border-radius:var(--radius-sm);"><div style="color:var(--text-muted);">资产负债率</div><div style="font-weight:600;">${latest.debtRatio||'--'}%</div></div>
        </div>

      </div>`;
    status.textContent = '';
  } catch(e) { el.innerHTML = '<div style="padding:10px;color:var(--accent-red);">获取失败</div>'; status.textContent = ''; }
}
</script>
</body>
</html>
